<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16142E">
<title>Chamaa</title>
<meta name="description" content="Chamaa — save together, grow together.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20256%20256%22%3E%3Crect%20width%3D%22256%22%20height%3D%22256%22%20rx%3D%2256%22%20fill%3D%22%23EEECFB%22/%3E%3Cg%20transform%3D%22translate%2824%2020%29%20scale%28.82%29%22%3E%3Cellipse%20fill%3D%22%2316142E%22%20cx%3D%22124%22%20cy%3D%22136%22%20rx%3D%2292%22%20ry%3D%2274%22/%3E%3Cpath%20fill%3D%22%2316142E%22%20d%3D%22M164%2074%20L190%2044%20L196%2092%20Z%22/%3E%3Crect%20fill%3D%22%2316142E%22%20x%3D%22200%22%20y%3D%22114%22%20width%3D%2234%22%20height%3D%2242%22%20rx%3D%2212%22/%3E%3Crect%20fill%3D%22%2316142E%22%20x%3D%2266%22%20y%3D%22186%22%20width%3D%2228%22%20height%3D%2244%22%20rx%3D%228%22/%3E%3Crect%20fill%3D%22%2316142E%22%20x%3D%22148%22%20y%3D%22186%22%20width%3D%2228%22%20height%3D%2244%22%20rx%3D%228%22/%3E%3Crect%20fill%3D%22%23EEECFB%22%20x%3D%22100%22%20y%3D%2270%22%20width%3D%2244%22%20height%3D%2210%22%20rx%3D%225%22/%3E%3Cpath%20d%3D%22M124%20140%20A7%207%200%200%201%20138%20140%20A14%2014%200%200%201%20110%20140%20A21%2021%200%200%201%20152%20140%20A28%2028%200%200%201%2096%20140%20A35%2035%200%200%201%20166%20140%22%20fill%3D%22none%22%20stroke%3D%22%23C8F04D%22%20stroke-width%3D%229%22%20stroke-linecap%3D%22round%22/%3E%3C/g%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-title" content="Chamaa">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet">
<style>
/* VOICE: the real Chamaa app, calm and trustworthy, money as the hero.
   IDEA: a working phone build of the approved UI/UX, first sprint, now worldwide.
   PICTURE: the phone itself, clickable: welcome -> sign up or log in -> SMS code -> home.
   COLOUR and TYPE: approved tokens only (ink, lavender, lime, violet, coral); Inter, display cut for amounts.
   LAYOUT: full-screen on a phone; framed phone + build notes beside it on wider screens. */
:root{--pig:#16142E;color-scheme:light;
  --ink:#16142E;--lime:#C8F04D;--coral:#FF8B6B;--late:#B23A12;--r-card:18px;--r-btn:14px;--frame:#0E0D1C;
  --bg:#EEECFB;--surface:#FFFFFF;--surface2:#F4F3FD;--text:#16142E;--muted:#55526F;--ph:#6E6B8F;--accent:#5B4BE8;
  --hero:#16142E;--hero-text:#FFFFFF;--hero-muted:#C9C6E8;--pri:#16142E;--pri-text:#FFFFFF;--sec:#FFFFFF;--sec-text:#16142E;
  --navoff:#77748F;--line:#DEDAF5;--icon:#5B4BE8;--scrim:rgba(22,20,46,.45)}
:root[data-theme=dark]{color-scheme:dark;
  --bg:#100F22;--surface:#1E1C3A;--surface2:#2A2850;--text:#F6F5FF;--muted:#CFCCEE;--ph:#A9A6CF;--accent:#B3ABFF;
  --hero:#2C2958;--hero-text:#FFFFFF;--hero-muted:#D6D3F5;--pri:#F6F5FF;--pri-text:#16142E;--sec:#1E1C3A;--sec-text:#F6F5FF;
  --navoff:#B0ADD6;--line:#3A3766;--icon:#B3ABFF;--scrim:rgba(0,0,0,.6);--late:#FFB59E;--pig:#F6F5FF}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;
  --bg:#100F22;--surface:#1E1C3A;--surface2:#2A2850;--text:#F6F5FF;--muted:#CFCCEE;--ph:#A9A6CF;--accent:#B3ABFF;
  --hero:#2C2958;--hero-text:#FFFFFF;--hero-muted:#D6D3F5;--pri:#F6F5FF;--pri-text:#16142E;--sec:#1E1C3A;--sec-text:#F6F5FF;
  --navoff:#B0ADD6;--line:#3A3766;--icon:#B3ABFF;--scrim:rgba(0,0,0,.6);--late:#FFB59E;--pig:#F6F5FF}}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
.disp{font-variation-settings:"opsz" 32;font-weight:800;letter-spacing:-.03em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.stage{min-height:100vh;display:flex;gap:48px;align-items:center;justify-content:center;padding:32px 16px}
.phone{width:390px;height:812px;border-radius:52px;background:var(--frame);padding:10px;flex:none}
.screen{width:100%;height:100%;border-radius:42px;background:var(--bg);position:relative;overflow:hidden}
.status{height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 28px;font-size:13px;font-weight:700}
.notch{width:96px;height:26px;border-radius:14px;background:var(--frame)}
.notes{max-width:340px}
.notes h1{font-size:34px;line-height:1.05;margin:0 0 12px;text-wrap:balance}
.notes p{color:var(--muted);margin:0 0 16px;font-size:15px}
.notes ol{padding-left:20px;margin:0 0 16px;font-size:15px}.notes li{margin-bottom:6px}
.sample{font-size:13px;color:var(--muted)}
@media(max-width:860px){
  .stage{padding:0;display:block}.notes{display:none}
  .phone{width:100%;height:100vh;height:100dvh;border-radius:0;padding:0;background:none}
  .screen{border-radius:0}.status{display:none}
}

.view{position:absolute;inset:44px 0 0;overflow-y:auto;padding:8px 20px 100px;display:none}
@media(max-width:860px){.view{inset:0;padding-top:max(16px,env(safe-area-inset-top))}}
.view.on{display:block;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
@media(prefers-reduced-motion:reduce){.view.on{animation:none}}

.card{background:var(--surface);border-radius:var(--r-card);padding:16px}
.hero{background:var(--hero);color:var(--hero-text);border-radius:var(--r-card);padding:16px}
.btn{display:block;width:100%;min-height:52px;border-radius:var(--r-btn);font-weight:700;font-size:15px;text-align:center}
.btn-ink{background:var(--pri);color:var(--pri-text)}
.btn-white{background:var(--sec);color:var(--sec-text)}
.btn-sm{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:12px;font-size:13px;font-weight:700}
.link{color:var(--accent);font-weight:600;font-size:14px;min-height:44px;display:block;width:100%;text-align:center}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:5px 10px;border-radius:10px}
.av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.bar{height:9px;border-radius:9px;background:rgba(22,20,46,.13)}.bar i{display:block;height:100%;border-radius:9px;background:var(--ink)}
.muted{color:var(--muted)}
.cc{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:24px;padding:0 6px;border-radius:7px;background:var(--surface2);color:var(--text);font-size:12px;font-weight:800;letter-spacing:.02em;flex:none}
.sheet-bg{position:absolute;inset:0;background:var(--scrim);z-index:20;display:none}
.sheet-bg.on{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:82%;background:var(--bg);border-radius:24px 24px 0 0;padding:10px 16px 16px;display:flex;flex-direction:column;z-index:21}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 12px;font-size:18px}
.clist{overflow-y:auto;margin-top:10px;background:var(--surface);border-radius:var(--r-card)}
.clist button{width:100%;display:flex;align-items:center;gap:12px;padding:0 14px;min-height:54px;font-size:16px;color:var(--text);text-align:left;border-top:1px solid var(--line)}
.clist button:first-child{border-top:0}
.clist button[aria-selected=true]{font-weight:700}
.clist .n{flex:1}.clist .d{color:var(--muted);font-weight:600}
.empty{padding:16px;color:var(--muted);font-size:15px}
.err{color:var(--late);font-size:13px;font-weight:600;min-height:20px;margin:4px 0 0}

/* forms */
.back{width:44px;height:44px;border-radius:50%;background:var(--surface);color:var(--text);display:flex;align-items:center;justify-content:center}
.ftitle{font-size:30px;line-height:1.1;margin:22px 0 6px}
.fsub{margin:0 0 20px;font-size:15px;color:var(--muted)}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:600;margin:0 0 6px}
.field .opt{color:var(--muted);font-weight:400}
.in{background:var(--surface);border-radius:var(--r-btn);display:flex;align-items:center;gap:10px;padding:0 14px;min-height:52px;border:2px solid transparent}
.in:focus-within{border-color:var(--accent)}
.in input::placeholder{color:var(--ph);opacity:1}
.in b{font-size:16px;white-space:nowrap}
.in input{border:0;outline:0;font:inherit;font-size:16px;flex:1;background:none;color:var(--text);min-height:48px;width:100%}
.pick{width:100%;min-height:52px;display:flex;align-items:center;gap:10px;text-align:left;font-size:16px;font-weight:600}
.pick span.n{flex:1}
.chev{flex:none}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);margin:6px 0 4px}
.check{color:var(--muted)}.check input{width:20px;height:20px;accent-color:var(--accent);margin:1px 0 0;flex:none}
.swap{text-align:center;font-size:14px;color:var(--muted);margin-top:8px}
.swap button{color:var(--accent);font-weight:700;min-height:44px;padding:0 6px}

/* welcome */
.w-top{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:4px}
.logo-tile{width:170px;height:170px;border-radius:50px;background:#fff;display:flex;align-items:center;justify-content:center}
.w-top h2{font-size:34px;line-height:1.08;margin:28px 0 10px}
.w-top p{font-size:15px;color:var(--muted);margin:0 0 30px;line-height:1.45}
.stack{display:grid;gap:10px}
.lang{display:flex;justify-content:center;gap:6px;margin-top:14px}
.lang button,.mode{font-size:13px;font-weight:600;padding:0 14px;min-height:40px;border-radius:10px;background:var(--surface);color:var(--text)}
.lang button[aria-pressed=true]{background:var(--pri);color:var(--pri-text)}
.mode{display:inline-flex;align-items:center;gap:6px}

/* otp */
.otp{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:20px 0 4px}
.otp input{height:58px;border-radius:var(--r-btn);border:2px solid transparent;background:var(--surface);text-align:center;font:800 24px Inter,sans-serif;color:var(--text);width:100%}
.otp input:focus{border-color:var(--accent);outline:0}

/* home */
.hd{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.bell{width:44px;height:44px;border-radius:50%;background:var(--surface);color:var(--text);display:flex;align-items:center;justify-content:center;position:relative}
.bell span{position:absolute;top:10px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--coral)}
.amt{font-size:clamp(28px,9vw,36px);margin:4px 0 12px;font-variation-settings:"opsz" 32;font-weight:800;letter-spacing:-.03em;white-space:nowrap}
.qa{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0 18px}
.qa svg{color:var(--icon)}
.qa button{background:var(--surface);color:var(--text);border-radius:16px;padding:12px 0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;min-height:64px}
.sec{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:700;margin-bottom:8px}
.sec a{color:var(--accent);font-size:13px;text-decoration:none}
.row{display:flex;align-items:center;gap:12px}
.goal{background:var(--lime);color:var(--ink);border-radius:var(--r-card);padding:16px;margin-top:10px}

.nav{position:absolute;left:12px;right:12px;bottom:12px;height:64px;background:var(--surface);border-radius:var(--r-card);display:none;align-items:center;justify-content:space-around;box-shadow:0 2px 10px rgba(22,20,46,.07)}
@media(max-width:860px){.nav{bottom:max(12px,env(safe-area-inset-bottom))}}
.nav.on{display:flex}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--navoff);min-width:52px;min-height:48px;justify-content:center}
.nav button[aria-current=page]{color:var(--text)}
.nav .plus{width:52px;height:52px;border-radius:50%;background:var(--lime);margin-top:-20px;min-width:0}
.hdrow{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.eye{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none;margin-right:-8px}
.hint{font-size:13px;color:var(--muted);margin:-6px 0 12px}
.forgot{color:var(--accent);font-weight:600;font-size:14px;min-height:44px}
.pick.mini{width:auto;gap:6px;padding:0 8px;font-size:15px;border-right:1px solid var(--line);border-radius:0;min-height:40px}
.modal{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%);background:var(--surface);border-radius:24px;padding:28px 20px 12px;text-align:center}
.modal h3{font-size:24px;margin:16px 0 8px}
.modal p{margin:0 0 14px;font-size:15px}
.mail{width:92px;height:92px;border-radius:50%;background:var(--lime);display:inline-flex;align-items:center;justify-content:center;position:relative}
.tick{position:absolute;right:2px;bottom:4px;width:28px;height:28px;border-radius:50%;background:#2E7D32;border:3px solid var(--surface);display:flex;align-items:center;justify-content:center}
.sheet-bg.on .modal{animation:pop .3s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(-46%) scale(.94)}}
@media(prefers-reduced-motion:reduce){.sheet-bg.on .modal{animation:none}}
.toast{position:absolute;left:20px;right:20px;bottom:90px;background:var(--pri);color:var(--pri-text);z-index:30;border-radius:14px;padding:12px 14px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* ===== Glassmorphism layer ===== */
:root{--glass:rgba(255,255,255,.62);--glass-hi:rgba(255,255,255,.80);--gb:rgba(255,255,255,.85);--gshadow:0 8px 30px rgba(45,36,120,.10);
  --hero:rgba(22,20,46,.86);--bg:#E8E5FB;--blob1:rgba(124,108,255,.55);--blob2:rgba(200,240,77,.65);--blob3:rgba(255,139,107,.45);--surface2:rgba(255,255,255,.75)}
:root[data-theme=dark]{--glass:rgba(38,35,78,.50);--glass-hi:rgba(30,28,62,.82);--gb:rgba(255,255,255,.14);--gshadow:0 10px 34px rgba(0,0,0,.40);
  --hero:rgba(70,62,150,.45);--bg:#0C0B1C;--blob1:rgba(109,93,245,.55);--blob2:rgba(200,240,77,.22);--blob3:rgba(255,139,107,.30);--surface2:rgba(255,255,255,.10)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--glass:rgba(38,35,78,.50);--glass-hi:rgba(30,28,62,.82);--gb:rgba(255,255,255,.14);--gshadow:0 10px 34px rgba(0,0,0,.40);
  --hero:rgba(70,62,150,.45);--bg:#0C0B1C;--blob1:rgba(109,93,245,.55);--blob2:rgba(200,240,77,.22);--blob3:rgba(255,139,107,.30);--surface2:rgba(255,255,255,.10)}}
.screen{isolation:isolate}
.screen::before,.screen::after,.glow{content:"";position:absolute;border-radius:50%;filter:blur(60px);z-index:-1;pointer-events:none}
.screen::before{width:300px;height:300px;background:var(--blob1);top:-60px;left:-90px;animation:drift 18s ease-in-out infinite alternate}
.screen::after{width:260px;height:260px;background:var(--blob2);top:300px;right:-110px;animation:drift 22s ease-in-out infinite alternate-reverse}
.glow{width:240px;height:240px;background:var(--blob3);bottom:-60px;left:-40px;animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(40px,30px) scale(1.12)}}
body{background:var(--bg)}
.screen{background:var(--bg)}
.card,.in,.qa button,.back,.bell,.nav,.btn-white,.lang button,.logo-tile,.clist,.modal,.sheet,.seg,.glassb{
  background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);
  border:1px solid var(--gb);box-shadow:var(--gshadow)}
.hero{background:var(--hero);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);border:1px solid rgba(255,255,255,.16);box-shadow:var(--gshadow)}
.goal{border:1px solid rgba(255,255,255,.55);box-shadow:0 10px 30px rgba(140,180,20,.25)}
.modal,.sheet{background:var(--glass-hi)}
.clist{box-shadow:none}
.clist button{border-top-color:var(--gb)}
.in{border-width:1px}
.in:focus-within{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--gshadow)}
.lang button[aria-pressed=true]{background:var(--pri);color:var(--pri-text);border-color:transparent}
.btn-ink{box-shadow:0 10px 24px rgba(22,20,46,.22)}
.nav .plus{box-shadow:0 8px 22px rgba(160,200,40,.45)}
.otp input{background:var(--glass);border:1px solid var(--gb)}
.logo-tile{background:rgba(255,255,255,.88)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  :root{--glass:rgba(255,255,255,.92)}:root[data-theme=dark]{--glass:rgba(34,32,66,.94)}}
@media(prefers-reduced-transparency:reduce){.card,.in,.qa button,.back,.bell,.nav,.btn-white,.lang button,.clist,.modal,.sheet{background:var(--glass-hi)}}
@media(prefers-reduced-motion:reduce){.screen::before,.screen::after,.glow{animation:none}}

/* ===== No visible scrollbars, compact auth forms ===== */
.view,.clist{scrollbar-width:none;-ms-overflow-style:none}
.view::-webkit-scrollbar,.clist::-webkit-scrollbar{display:none;width:0;height:0}
#v-signup,#v-login{padding-bottom:20px}
#v-signup .ftitle,#v-login .ftitle{font-size:28px;margin:12px 0 4px}
#v-signup .fsub,#v-login .fsub{font-size:14px;margin:0 0 14px;line-height:1.4}
#v-signup .field{margin-bottom:9px}
#v-signup .field label{margin-bottom:4px}
#v-signup .in{min-height:48px}
#v-signup .in input{min-height:44px}
#v-signup .pick.mini{min-height:36px}
#v-signup .hint{margin:-4px 0 8px;font-size:12.5px}
#v-signup .check{margin:2px 0 0}
#v-signup .err{min-height:18px;margin:2px 0 4px}
#v-signup .swap,#v-login .swap{margin-top:2px}
#v-signup .swap button,#v-login .swap button{min-height:40px}

/* ===== Dashboard build ===== */
.vt{flex:1;margin:0 10px;font-size:17px;font-weight:700;text-align:center}
.badge{position:absolute;top:4px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--coral);color:var(--ink);font:800 11px/18px Inter,sans-serif;text-align:center}
.curchip{font-size:12px;font-weight:700;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:0 10px;min-height:30px;display:inline-flex;align-items:center;gap:6px}
.baleye{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--hero-muted)}
.baleye:hover{color:#fff}
.locnote{font-size:12.5px;color:var(--muted);margin:8px 2px 0}
.qa{margin-top:10px}
.btn-lime{background:var(--lime);color:var(--ink);font-weight:800;box-shadow:0 10px 24px rgba(160,200,40,.35)}
.btn-lime[disabled]{opacity:.7}
.payamt{font-size:42px;margin:4px 0 8px}
.chip-s{display:inline-block;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:10px;background:var(--glass);border:1px solid var(--gb)}
.lbl2{font-size:13px;font-weight:700;margin:0 0 8px}
.mrow{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;text-align:left;border-top:1px solid var(--line);padding:6px 0}
.mrow:first-child{border-top:0}
.mrow .mi{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--surface2)}

.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);flex:none;position:relative}
.mrow[aria-checked=true] .radio{border-color:var(--accent)}.mrow[aria-checked=true] .radio::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--accent)}
.kv{display:flex;justify-content:space-between;align-items:center;font-size:14px;min-height:34px;gap:10px}
.linkish{color:var(--accent);font-weight:700;font-size:14px;min-height:36px}
.okc{width:100px;height:100px;border-radius:50%;background:var(--lime);display:inline-flex;align-items:center;justify-content:center;box-shadow:0 12px 34px rgba(160,200,40,.45)}
.medal{width:46px;height:46px;border-radius:50%;background:var(--lime);color:var(--ink);display:flex;align-items:center;justify-content:center;font:800 20px Inter,sans-serif;flex:none}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.tiles div{background:var(--surface2);border-radius:12px;padding:10px 4px}.tiles b{display:block;font-size:15px;font-weight:800;white-space:nowrap}.tiles span{font-size:11.5px;color:var(--muted)}
.seg{display:flex;padding:4px;border-radius:14px;margin:12px 0}
.seg button{flex:1;min-height:40px;border-radius:11px;font-weight:700;font-size:14px}
.seg button[aria-selected=true]{background:var(--pri);color:var(--pri-text)}
.grow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.grow:first-child{border-top:0}
.gi{width:38px;height:38px;border-radius:11px;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex:none;color:var(--icon)}
.thin{height:6px;border-radius:9px;background:var(--surface2);margin-top:6px}.thin i{display:block;height:100%;border-radius:9px;background:var(--accent)}
.addg{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:var(--r-btn);border:1.5px dashed var(--accent)!important;color:var(--accent);font-weight:700;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chips button{min-height:38px;padding:0 13px;border-radius:11px;font-size:13.5px;font-weight:600;background:var(--surface2);border:1px solid var(--gb)}
.chips button[aria-pressed=true]{background:var(--pri);color:var(--pri-text);border-color:transparent}
.cursym{font-size:15px;color:var(--muted);white-space:nowrap}
.list .irow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list .irow:first-child{border-top:0}
.tag{font-size:11.5px;font-weight:700;padding:4px 8px;border-radius:8px;white-space:nowrap}
.t-paid{background:#E9F9C8;color:#3F5A00}.t-due{background:#ECEAFB;color:#4A3CD0}.t-late{background:#FFE4DC;color:#B23A12}
.st{margin-top:4px}
.st-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.st-sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
.st-sum div{background:var(--surface2);border-radius:12px;padding:10px}.st-sum span{display:block;font-size:11.5px;color:var(--muted)}.st-sum b{font-size:15px;white-space:nowrap}
.st table{width:100%;border-collapse:collapse;font-size:12.5px}
.st th{text-align:left;font-weight:600;color:var(--muted);padding:6px 4px;border-bottom:1px solid var(--line)}
.st td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.st td.n,.st th.n{text-align:right;white-space:nowrap}
.pos{color:#3F7A00}:root[data-theme=dark] .pos{color:#C8F04D}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .pos{color:#C8F04D}}
.nrow{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--gb);width:100%;text-align:left}
.nrow:first-child{border-top:0}
.nrow .dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}
.nrow .tx{flex:1;font-size:14px}.nrow .tx small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.nrow.unread .tx{font-weight:700}
.nrow .new{font-size:10.5px;font-weight:800;color:var(--ink);background:var(--lime);border-radius:6px;padding:2px 6px;flex:none}
.banner{position:absolute;left:14px;right:14px;top:52px;z-index:40;display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--glass-hi);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--gb);box-shadow:var(--gshadow);font-size:14px;font-weight:600;transform:translateY(-140%);opacity:0;transition:transform .35s ease,opacity .35s;cursor:pointer}
.banner.on{transform:none;opacity:1}
@media(max-width:860px){.banner{top:max(10px,env(safe-area-inset-top))}}
@media(prefers-reduced-motion:reduce){.banner{transition:none}}
#v-goals,#v-invite,#v-stmt,#v-pay{padding-bottom:100px}
.goal{cursor:default}

/* ===== Wheel date & time picker ===== */
.dtbtn{width:100%;min-height:48px;display:flex;align-items:center;gap:10px;text-align:left;font-size:16px}
.dtbtn .dv{flex:1}.dtbtn .dv.ph{color:var(--ph)}
.dt-prev{text-align:center;font-weight:800;font-size:18px;margin:4px 0 10px}
.wheels{position:relative;display:flex;gap:4px;height:200px;border-radius:16px;background:var(--surface2);overflow:hidden;
  -webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.wheels .band{position:absolute;left:8px;right:8px;top:80px;height:40px;border-radius:11px;background:var(--glass-hi);border:1px solid var(--gb);pointer-events:none}
.wcol{position:relative;flex:1;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;padding:80px 0;outline:none}
.wcol::-webkit-scrollbar{display:none}
.wcol:focus-visible{box-shadow:inset 0 0 0 2px var(--accent);border-radius:12px}
.wcol div{height:40px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-size:17px;color:var(--muted);user-select:none;cursor:pointer;transition:color .15s,font-weight .15s}
.wcol div.sel{color:var(--text);font-weight:700}
.wcol.wide{flex:1.5}

/* ===== Me ===== */
.prof{display:flex;gap:14px;align-items:center;margin-top:10px}
.ph-wrap{position:relative;flex:none}
.ph-av{width:76px;height:76px;border-radius:50%;background:var(--coral);color:var(--ink);display:flex;align-items:center;justify-content:center;font:800 26px Inter,sans-serif;overflow:hidden}
.ph-av img,.av img{width:100%;height:100%;object-fit:cover;display:block}
.av{overflow:hidden}
.ph-cam{position:absolute;right:-4px;bottom:-4px;width:34px;height:34px;border-radius:50%;background:var(--lime);display:flex;align-items:center;justify-content:center;border:3px solid var(--bg);cursor:pointer}
.ph-cam:focus-within,.ph-cam:hover{outline:2px solid var(--accent)}
.srow{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;text-align:left;font-size:15px}
.srow .n{flex:1;font-weight:600}.srow .n small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.srow.tap{cursor:pointer}
.sw{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:transform .2s}
.sw[aria-checked=true]{background:#7CB518}.sw[aria-checked=true]::after{transform:translateX(20px)}
@media(prefers-reduced-motion:reduce){.sw,.sw::after{transition:none}}
.seg-s{margin:0 0 4px}
.seg-s button[aria-pressed=true]{background:var(--pri);color:var(--pri-text)}
.seg-s button{flex:1;min-height:40px;border-radius:11px;font-weight:700;font-size:14px}
.bk{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.bk:first-child{border-top:0}
.bk .mi{width:40px;height:40px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex:none}
#v-me{padding-bottom:110px}
.bka{display:flex;flex-direction:column;align-items:flex-end;flex:none}.bka .linkish{font-size:13px;min-height:32px;white-space:nowrap}

/* ===== Phone fit: safe areas + calmer sizes ===== */
.view{padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right))}
.view{padding-top:14px}
@media(max-width:860px){.view{padding-top:calc(env(safe-area-inset-top) + 18px)}
  .nav{left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));bottom:calc(env(safe-area-inset-bottom) + 10px)}}
.hero{padding:14px 16px;border-radius:20px}
.amt{font-size:clamp(26px,7.6vw,32px);margin:2px 0 10px;line-height:1.1}
.payamt{font-size:clamp(30px,9vw,36px)}
.hero .pill{font-size:11.5px;padding:4px 9px}
.curchip{min-height:28px;font-size:11.5px;padding:0 8px}
.baleye{width:32px;height:32px}
.qa button{min-height:60px;padding:10px 0;font-size:11.5px}
.hd{margin-bottom:14px}
.goal .disp{font-size:20px!important}
@media(max-width:360px){
  .view{padding-left:14px;padding-right:14px}
  .qa{gap:6px}.qa button{font-size:10.5px}
  .two{gap:8px}
  .ftitle,#v-signup .ftitle,#v-login .ftitle{font-size:24px}
  .w-top h2{font-size:28px}.logo-tile{width:140px;height:140px;border-radius:42px}
  .nav button{min-width:44px;font-size:10px}
  .tiles b{font-size:13px}
}

/* ===== Autofill: keep glass look, no grey/blue browser fill ===== */
.in input:-webkit-autofill,.in input:-webkit-autofill:hover,.in input:-webkit-autofill:focus{
  -webkit-text-fill-color:var(--text);caret-color:var(--text);
  -webkit-box-shadow:0 0 0 40px transparent inset;box-shadow:0 0 0 40px transparent inset;
  transition:background-color 99999s ease-out 0s}
.in input:autofill{background:transparent}
.in input::selection{background:rgba(124,108,255,.30)}

/* ===== KYC ===== */
.kprog{height:6px;border-radius:6px;background:var(--surface2);margin-top:12px;overflow:hidden}.kprog i{display:block;height:100%;background:var(--lime);border-radius:6px;transition:width .3s}
.kyc{display:flex;gap:12px;align-items:center;margin-bottom:18px}
.kyc .ki{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.pick2{width:100%;min-height:48px;display:flex;align-items:center;gap:10px;text-align:left;font-size:16px;font-weight:600}
.pick2 .n{flex:1}
.up{display:flex;align-items:center;gap:12px;width:100%;min-height:72px;padding:12px;border-radius:16px;border:1.5px dashed var(--accent);color:var(--text);cursor:pointer;margin-bottom:10px;text-align:left}
.up:focus-within{outline:2px solid var(--accent)}
.up .th{width:56px;height:44px;border-radius:9px;background:var(--surface2);flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--icon)}
.up .th img{width:100%;height:100%;object-fit:cover}
.up.done{border-style:solid;border-color:#7CB518}
.up.selfie .th{width:56px;height:56px;border-radius:50%}
.up b{display:block;font-size:14.5px}.up small{color:var(--muted);font-size:12.5px}
.rv{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:8px 0;border-top:1px solid var(--line)}.rv:first-child{border-top:0}.rv span{color:var(--muted)}
.ctag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 7px;border-radius:7px;background:var(--surface2);margin:2px 4px 0 0}
#v-kyc{padding-bottom:40px}
.kh{font-size:20px;margin:14px 0 12px}
#sheet-bg,#dt-bg{z-index:32}

/* ===== Plain app: no frame, no notes ===== */
.stage{display:block;padding:0;min-height:100dvh}
.phone{width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;border-radius:0;padding:0;background:none}
.screen{border-radius:0}
.view{inset:0;padding-top:calc(env(safe-area-inset-top) + 18px)}
.nav{left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));bottom:calc(env(safe-area-inset-bottom) + 10px)}
@media(min-width:520px){.screen{box-shadow:0 0 0 1px var(--gb),0 20px 60px rgba(22,20,46,.12)}}

/* ===== Splash: coin circles the name, drops into the piggy bank ===== */
#splash{position:absolute;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
#splash::before,#splash::after{content:"";position:absolute;border-radius:50%;filter:blur(60px);pointer-events:none}
#splash::before{width:300px;height:300px;background:var(--blob1);top:-60px;left:-90px}
#splash::after{width:260px;height:260px;background:var(--blob2);bottom:-60px;right:-100px}
.sp-stack{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:1}
#sp-pig{width:132px;height:132px;opacity:0;transform:scale(.4)}
#sp-word{font:800 48px/1 Inter,system-ui,sans-serif;font-variation-settings:"opsz" 32;letter-spacing:-.04em;color:var(--text);opacity:0;position:relative;z-index:2}
#sp-coin{position:absolute;left:0;top:0;width:26px;height:26px;margin:-13px 0 0 -13px;z-index:3;opacity:0;will-change:transform}
#sp-coin.back{z-index:1}
#sp-tag{font-size:14px;color:var(--muted);opacity:0;margin-top:4px}
#splash.out{animation:spOut .45s ease forwards}
@keyframes spOut{to{opacity:0;transform:scale(1.06)}}
</style>
</head>

<div class="stage">
  <div class="phone"><div class="screen">
    <div class="glow" aria-hidden="true"></div>
    <div id="splash" role="img" aria-label="Chamaa"><div class="sp-stack"><svg id="sp-pig" viewBox="0 0 256 256" aria-hidden="true"><ellipse fill="var(--pig)" cx="124" cy="136" rx="92" ry="74"/><path fill="var(--pig)" d="M164 74 L190 44 L196 92 Z"/><rect fill="var(--pig)" x="200" y="114" width="34" height="42" rx="12"/><rect fill="var(--pig)" x="66" y="186" width="28" height="44" rx="8"/><rect fill="var(--pig)" x="148" y="186" width="28" height="44" rx="8"/><rect fill="var(--bg)" x="100" y="70" width="44" height="10" rx="5"/><path id="sp-spiral" d="M124 140 A7 7 0 0 1 138 140 A14 14 0 0 1 110 140 A21 21 0 0 1 152 140 A28 28 0 0 1 96 140 A35 35 0 0 1 166 140" fill="none" stroke="#C8F04D" stroke-width="9" stroke-linecap="round"/></svg><div id="sp-word">chamaa</div><div id="sp-tag" data-t="tagPlain"></div></div><div id="sp-coin"><svg viewBox="0 0 26 26" width="26" height="26"><circle cx="13" cy="13" r="12" fill="#C8F04D" stroke="#16142E" stroke-width="2"/><circle cx="13" cy="13" r="7.5" fill="none" stroke="#16142E" stroke-width="1.4" opacity=".55"/><path d="M15.6 10.4a3.6 3.6 0 1 0 0 5.2" fill="none" stroke="#16142E" stroke-width="2" stroke-linecap="round"/></svg></div></div>
    
    

    <section class="view on" id="v-welcome" aria-label="Welcome">
      <div class="hdrow" style="justify-content:flex-end"><button class="bell" type="button" data-mode="1"></button></div>
      <div class="w-top">
        <div class="logo-tile"><svg viewBox="0 0 256 256" width="124" height="124" role="img" aria-label="Chamaa logo"><ellipse fill="#16142E" cx="124" cy="136" rx="92" ry="74"/><path fill="#16142E" d="M164 74 L190 44 L196 92 Z"/><rect fill="#16142E" x="200" y="114" width="34" height="42" rx="12"/><rect fill="#16142E" x="66" y="186" width="28" height="44" rx="8"/><rect fill="#16142E" x="148" y="186" width="28" height="44" rx="8"/><rect fill="#fff" x="100" y="70" width="44" height="10" rx="5"/><path d="M124 140 A7 7 0 0 1 138 140 A14 14 0 0 1 110 140 A21 21 0 0 1 152 140 A28 28 0 0 1 96 140 A35 35 0 0 1 166 140" fill="none" stroke="#C8F04D" stroke-width="9" stroke-linecap="round"/></svg></div>
        <h2 class="disp" data-t="tag"></h2>
        <p data-t="sub"></p>
      </div>
      <div class="stack">
        <button class="btn btn-ink" type="button" data-go="signup" data-t="create"></button>
        <button class="btn btn-white" type="button" data-go="login" data-t="login"></button>
        <button class="link" type="button" data-go="signup" data-invite="1" data-t="inv"></button>
      </div>
      <div class="lang" role="group" aria-label="Language"><button type="button" data-l="en" aria-pressed="true">English</button><button type="button" data-l="sw" aria-pressed="false">Kiswahili</button></div>
    </section>

    <section class="view" id="v-signup" aria-label="Create account">
      <div class="hdrow"><button class="back" type="button" data-go="welcome" aria-label="Back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button><button class="bell" type="button" data-mode="1"></button></div>
      <h2 class="disp ftitle" data-t="suT"></h2>
      <p class="fsub" data-t="suS"></p>
      <form id="f-signup" novalidate>
        <div class="two">
          <div class="field"><label for="su-first" data-t="first"></label><div class="in"><input id="su-first" autocomplete="given-name" placeholder="Wanjiru"></div></div>
          <div class="field"><label for="su-last" data-t="last"></label><div class="in"><input id="su-last" autocomplete="family-name" placeholder="Kamau"></div></div>
        </div>
        <div class="field"><label for="su-email" data-t="email"></label><div class="in"><input id="su-email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com"></div></div>
        <div class="field"><label id="su-cl" data-t="phone"></label><div class="in" style="padding:0 6px 0 4px;gap:4px"><button type="button" class="pick country mini" id="su-country" data-cc="KE" aria-haspopup="dialog"></button><input id="su-phone" class="ph" inputmode="tel" autocomplete="tel-national" placeholder="712 345 678" aria-labelledby="su-cl"></div></div>

    <div class="sheet-bg" id="verify-bg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="vf-t">

function wcol(parent,key,items,sel,wide){const c=document.createElement('div');c.className='wcol'+(wide?' wide':'');c.tabIndex=0;c.dataset.k=key;c.setAttribute('role','listbox');
  c.innerHTML=items.map((t,i)=>`<div data-i="${i}" role="option">${t}</div>`).join('');parent.appendChild(c);
  const mark=i=>{[...c.children].forEach((el,j)=>{el.classList.toggle('sel',j===i);el.setAttribute('aria-selected',j===i)})};
  c._set=(i,smooth)=>{c.scrollTo({top:i*40,behavior:smooth&&!reduce()?'smooth':'auto'});mark(i)};
  let tm;c.addEventListener('scroll',()=>{clearTimeout(tm);const i0=Math.round(c.scrollTop/40);mark(i0);tm=setTimeout(()=>{const i=Math.max(0,Math.min(items.length-1,Math.round(c.scrollTop/40)));pickWheel(key,i)},90)});
  c.addEventListener('click',e=>{const it=e.target.closest('[data-i]');if(it)c._set(+it.dataset.i,true)});
  c.addEventListener('keydown',e=>{const i=Math.round(c.scrollTop/40);if(e.key==='ArrowDown'){e.preventDefault();c._set(Math.min(items.length-1,i+1),true)}if(e.key==='ArrowUp'){e.preventDefault();c._set(Math.max(0,i-1),true)}});
  requestAnimationFrame(()=>c._set(sel,false));return c}
function buildDate(){const w=$('w-date');w.querySelectorAll('.wcol').forEach(x=>x.remove());
  const days=Array.from({length:dim(dts.y,dts.m)},(_,i)=>i+1);if(dts.d>days.length)dts.d=days.length;
  wcol(w,'d',days,dts.d-1);wcol(w,'m',MON[lang],dts.m,true);wcol(w,'y',yrs,yrs.indexOf(dts.y)<0?0:yrs.indexOf(dts.y));}
function buildTime(){const w=$('w-time');w.querySelectorAll('.wcol').forEach(x=>x.remove());
  const h12=dts.h%12||12;wcol(w,'h',Array.from({length:12},(_,i)=>i+1),h12-1);wcol(w,'mi',Array.from({length:60},(_,i)=>pad(i)),dts.mi);wcol(w,'ap',['AM','PM'],dts.h>=12?1:0);}
function dtPrev(){const dob=dtBtn&&dtBtn.dataset.dt==='dob';$('dt-prev').textContent=fmtDT(`${dts.y}-${pad(dts.m+1)}-${pad(dts.d)}`+(dob?'':`T${pad(dts.h)}:${pad(dts.mi)}`))}
function pickWheel(k,i){if(k==='d')dts.d=i+1;else if(k==='m'){dts.m=i;if(dts.d>dim(dts.y,dts.m)){dts.d=dim(dts.y,dts.m)}buildDayOnly()}else if(k==='y'){dts.y=yrs[i];if(dts.d>dim(dts.y,dts.m))dts.d=dim(dts.y,dts.m);buildDayOnly()}
  else if(k==='h'){const pm=dts.h>=12;dts.h=(i+1)%12+(pm?12:0)}else if(k==='mi')dts.mi=i;else if(k==='ap'){const h=dts.h%12;dts.h=h+(i?12:0)}dtPrev()}
function buildDayOnly(){const w=$('w-date'),old=w.querySelector('[data-k=d]'),n=dim(dts.y,dts.m);if(old&&old.children.length===n)return;if(old)old.remove();const c=wcol(w,'d',Array.from({length:n},(_,i)=>i+1),dts.d-1);w.insertBefore(c,w.querySelector('[data-k=m]'))}
function openDt(btn){dtBtn=btn;const t=T[lang],now=new Date(),mode=btn.dataset.dt;
  const y0=now.getFullYear();yrs=mode==='future'?Array.from({length:11},(_,i)=>y0+i):mode==='dob'?Array.from({length:86},(_,i)=>y0-100+i):Array.from({length:8},(_,i)=>y0-7+i);
  const dob=mode==='dob';$('w-time').hidden=dob;$('w-time-l').hidden=dob;
  let d=btn.dataset.v?new Date(btn.dataset.v):null;
  if(!d||isNaN(d)){d=new Date(now);if(mode==='dob'){d=new Date(1990,0,1,12,0)}else if(mode==='future'){d.setMonth(d.getMonth()+6);d.setHours(9,0,0,0)}else if(btn.id==='st-from'){d.setMonth(d.getMonth()-1);d.setHours(0,0,0,0)}else{d.setHours(23,59,0,0)}}
  dts={y:d.getFullYear(),m:d.getMonth(),d:d.getDate(),h:d.getHours(),mi:d.getMinutes()};if(!yrs.includes(dts.y))dts.y=yrs[0];
  $('dt-t').textContent=btn.id==='ng-date'?t.dtGoal:btn.id==='st-from'?t.dtFrom:mode==='dob'?t.dob:t.dtTo;
  $('dt-bg').classList.add('on');buildDate();buildTime();dtPrev();setTimeout(()=>$('w-date').querySelector('.wcol').focus({preventScroll:true}),80)}

function kycCard(){const t=T[lang];const SHI='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>';
  if(kyc.status==='verified')return `<div class="card kyc"><span class="ki" style="background:#E9F9C8;color:#3F5A00">${SHI}</span><div style="flex:1"><b style="font-size:15px">${t.kycOk}</b><div class="muted" style="font-size:12.5px">${t.kycOkS}</div><div>${kyc.countries.map(c=>`<span class="ctag">${c} · ${esc(cty(c)[1])}</span>`).join('')}</div><button type="button" class="linkish" id="kyc-more" style="font-size:13px">${t.addCountry}</button></div></div>`;
  if(kyc.status==='pending')return `<div class="card kyc"><span class="ki" style="background:#ECEAFB;color:#4A3CD0">${SHI}</span><div style="flex:1"><b style="font-size:15px">${t.kycPend}</b><div class="muted" style="font-size:12.5px">${t.kycPendS}</div></div></div>`;
  return `<div class="card kyc" style="border-color:rgba(255,139,107,.6)"><span class="ki" style="background:#FFE4DC;color:#B23A12">${SHI}</span><div style="flex:1"><b style="font-size:15px">${t.kycNone}</b><div class="muted" style="font-size:12.5px">${t.kycNoneS}</div></div><button type="button" class="btn-sm" style="background:var(--pri);color:var(--pri-text)" id="kyc-start">${t.startK}</button></div>`}
document.addEventListener('click',e=>{
  if(e.target.closest('#kyc-start')||e.target.closest('#kyc-more')){startKyc();return}
  const kp=e.target.closest('[data-kpick]');if(kp){openSheet({kyc:kp.dataset.kpick});return}
  const kt=e.target.closest('[data-ktype]');if(kt){kd.type=+kt.dataset.ktype;document.querySelectorAll('[data-ktype]').forEach(b=>b.setAttribute('aria-pressed',b===kt));return}
  if(e.target.closest('#bk-cc')){openSheet({kyc:'bank'});return}
},true);


/* ---------- splash: coin circles the name, drops into the piggy bank ---------- */
function runSplash(){const sp=$('splash');if(!sp)return;let done=false;
  const finish=()=>{if(done)return;done=true;sp.classList.add('out');setTimeout(()=>sp.remove(),460)};
  sp.addEventListener('click',finish);
  const word=$('sp-word'),pig=$('sp-pig'),coin=$('sp-coin'),tag=$('sp-tag');
  if(reduce()||!sp.animate){word.style.opacity=1;pig.style.opacity=1;pig.style.transform='none';tag.style.opacity=1;setTimeout(finish,900);return}
  const R=sp.getBoundingClientRect(),w=word.getBoundingClientRect(),pr=pig.getBoundingClientRect();
  const cx=w.left-R.left+w.width/2,cy=w.top-R.top+w.height/2,rx=w.width/2+26,ry=w.height/2+18;
  const pigScale=1/0.4;/* pig is drawn at scale .4 at rest; compute its final rect */
  const pw=pr.width*pigScale,ph=pr.height*pigScale,pl=pr.left-R.left+pr.width/2-pw/2,pt=pr.top-R.top+pr.height/2-ph/2;
  const slotX=pl+122/256*pw,slotY=pt+75/256*ph;
  word.animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:450,easing:'ease-out',fill:'forwards'});
  /* orbit: one and a half loops around the name, coin flipping as it goes */
  const N=48,frames=[];const loops=1.5,a0=Math.PI;
  for(let i=0;i<=N;i++){const p=i/N,a=a0+p*loops*2*Math.PI,x=cx+rx*Math.cos(a),y=cy+ry*Math.sin(a)*0.9,front=Math.sin(a)>0;
    frames.push({transform:`translate(${x}px,${y}px) scaleX(${Math.abs(Math.cos(a*2)).toFixed(2)*0.7+0.3}) scale(${front?1:.82})`,opacity:1,offset:p})}
  coin.style.opacity=1;
  const orbit=coin.animate(frames,{duration:1500,delay:350,easing:'cubic-bezier(.45,.05,.55,.95)',fill:'forwards'});
  /* switch layer when the coin passes behind the word */
  let t0=performance.now()+350;const layer=()=>{if(done)return;const p=Math.min(1,Math.max(0,(performance.now()-t0)/1500));const a=a0+p*loops*2*Math.PI;coin.classList.toggle('back',Math.sin(a)<0&&p<1);if(p<1)requestAnimationFrame(layer)};requestAnimationFrame(layer);
  orbit.finished.then(()=>{if(done)return;
    pig.animate([{opacity:0,transform:'scale(.4)'},{opacity:1,transform:'scale(1.08)',offset:.7},{opacity:1,transform:'scale(1)'}],{duration:420,easing:'ease-out',fill:'forwards'});
    const end=frames[N].transform.match(/translate\(([-\d.]+)px,([-\d.]+)px\)/),ex=+end[1],ey=+end[2];
    const midX=(ex+slotX)/2,midY=Math.min(ey,slotY)-70;
    const fly=coin.animate([{transform:`translate(${ex}px,${ey}px) scale(1)`},{transform:`translate(${midX}px,${midY}px) scale(1.15) rotate(-20deg)`,offset:.55},{transform:`translate(${slotX}px,${slotY-16}px) scale(1) rotate(0deg) scaleX(.35)`,offset:.85},{transform:`translate(${slotX}px,${slotY+6}px) scale(.8) scaleX(.2)`,opacity:0}],{duration:820,delay:220,easing:'cubic-bezier(.3,.1,.3,1)',fill:'forwards'});
    fly.finished.then(()=>{if(done)return;
      pig.animate([{transform:'scale(1)'},{transform:'scale(1.06,.92) translateY(4px)'},{transform:'scale(.98,1.04) translateY(-6px)'},{transform:'scale(1)'}],{duration:480,easing:'ease-out'});
      const sp2=document.getElementById('sp-spiral');if(sp2)sp2.animate([{strokeWidth:9},{strokeWidth:13},{strokeWidth:9}],{duration:480});
      tag.animate([{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:400,delay:150,fill:'forwards'});
      setTimeout(finish,1150)})})}

$('f-signup').addEventListener('submit',e=>{e.preventDefault();const t=T[lang],er=$('e-signup');
  const v=id=>$(id).value.trim(),ph=v('su-phone').replace(/\D/g,'').replace(/^0+/,''),pw=$('su-pw').value;
  const fail=(m,id)=>{er.textContent=m;$(id).focus()};
  if(!v('su-first'))return fail(t.eFirst,'su-first');if(!v('su-last'))return fail(t.eLast,'su-last');
  if(!emailOk(v('su-email')))return fail(t.eEmail,'su-email');if(ph.length<6||ph.length>14)return fail(t.ePhone,'su-phone');
  if(!v('su-city'))return fail(t.eCity,'su-city');if(pw.length<8||!/\d/.test(pw))return fail(t.ePw,'su-pw');
  if(!$('su-terms').checked)return fail(t.eTerms,'su-terms');
  er.textContent='';user.first=v('su-first');user.last=v('su-last');$('li-email').value=v('su-email');openVerify(v('su-email'))});

document.addEventListener('click',e=>{
  const ey=e.target.closest('[data-eye]');if(ey){const i=ey.previousElementSibling;i.type=i.type==='password'?'text':'password';eyeUI();return}
  const ch=e.target.closest('[data-chip]');if(ch){const k=ch.dataset.chip,i=+ch.dataset.i;
    if(k==='cat'){ngCat=i;chipRow('ng-cat',T[lang].cats,i,'cat');const nm=$('ng-name');if(!nm.value||T[lang].cats.some(c=>nm.value.startsWith(c)))nm.value=T[lang].cats[i]+' '+new Date().getFullYear();return}
    if(k==='bk'){bkType=i;bankForm();return}
    st[k]=i;renderStForm();$('e-st').textContent='';return}
  const mt=e.target.closest('[data-method]');if(mt){method=mt.dataset.method;renderMethods();return}
  if(e.target.closest('#addgoal')){openGoal();return}
  const g=e.target.closest('[data-go]');if(g){if(g.dataset.go==='pay'&&needKyc())return;if(g.dataset.go==='signup')$('inv-field').hidden=!g.dataset.invite;show(g.dataset.go);return}
  const l=e.target.closest('[data-l]');if(l){lang=l.dataset.l;store('chamaa-lang',lang);render();return}
  const m=e.target.closest('[data-mode]');if(m){const d=!isDark();document.documentElement.dataset.theme=d?'dark':'light';store('chamaa-mode',d?'dark':'light');renderMe();return}
  const q=e.target.closest('[data-toast]');if(q){e.preventDefault();toast(q.dataset.toast==='dl'?T[lang].dlSoon:T[lang].soon)}
});
